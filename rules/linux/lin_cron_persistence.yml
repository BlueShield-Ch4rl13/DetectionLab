title: Persistencia por cron
id: 9f783794-6644-5a53-8f89-77dca1717c53
status: experimental
description: Edicion de crontab o escritura en /etc/cron*.
references:
- https://attack.mitre.org/techniques/T1053/003/
author: C. Villalba
date: 2026/07/16
tags:
- attack.persistence
- attack.t1053.003
- iso27001-2022.a-8-9
- nist.cm-5
- nist.cm-7
logsource:
  category: process_creation
  product: linux
detection:
  # "crontab -" casaba con "crontab -l" (listar, que es lectura). Lo que
  # instala tareas es "crontab -" (desde stdin), "crontab -e" o escribir en
  # los ficheros de cron.
  selection_crontab:
  - CommandLine|endswith: crontab -
  - CommandLine|contains:
    - 'crontab - '
    - crontab -e
  selection_ficheros:
    CommandLine|contains:
    - /etc/cron.d/
    - /etc/crontab
    - /var/spool/cron
  filtro_lectura:
    CommandLine|startswith:
    - 'cat '
    - 'less '
    - 'more '
    - 'head '
    - 'tail '
    - 'grep '
    - 'ls '
    - crontab -l
  condition: selection_crontab or (selection_ficheros and not filtro_lectura)
falsepositives:
- Tareas programadas legitimas
level: medium
