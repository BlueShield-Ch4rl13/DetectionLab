title: Borrado o reduccion del registro de auditoria
id: 15af3283-6349-580f-980f-519cc737d589
status: experimental
description: |
    Capacidad transversal de visibilidad y analitica del modelo CISA. Sin registro no
    hay deteccion, y por eso su manipulacion es uno de los primeros movimientos tras
    conseguir privilegios. Cubre el borrado del canal, la desactivacion de categorias
    de auditoria y la reduccion del tamano de retencion, que es la version silenciosa
    del borrado.
references:
    - https://attack.mitre.org/techniques/T1070/001/
    - https://www.cisa.gov/zero-trust-maturity-model
author: BlueShield-Ch4rl13
date: 2026-08-31
tags:
    - attack.defense-evasion
    - attack.t1070.001
    - attack.t1562.002
    - iso27001-2022.a-8-15
    - iso27001-2022.a-8-7
    - nist.au-11
    - nist.au-9
    - nist.cm-7
    - nist.si-3
logsource:
    product: windows
    service: security
detection:
    # 1100 (servicio de registro detenido) se quito: lo genera cada apagado y
    # la regla es critica, asi que aislaba equipos solos al apagarlos.
    selection_borrado:
        EventID: 1102   # registro de auditoria borrado
    # 4719 sale en cada refresco de GPO (lo aplica SYSTEM) y al ANADIR
    # auditoria. Solo interesa una cuenta que no es SYSTEM QUITANDO auditoria:
    # %%8448 = exito retirado, %%8450 = fallo retirado.
    selection_politica:
        EventID: 4719
        AuditPolicyChanges|contains:
            - '%%8448'
            - '%%8450'
    filtro_gpo:
        SubjectUserSid: 'S-1-5-18'
    condition: selection_borrado or (selection_politica and not filtro_gpo)
falsepositives:
    - Un administrador que vacia el registro de Seguridad a mano en un equipo de pruebas, que debe ir en la lista de excepciones por equipo
level: critical
