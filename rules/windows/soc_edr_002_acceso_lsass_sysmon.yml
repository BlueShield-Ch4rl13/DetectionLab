title: Acceso a memoria de LSASS con permisos de lectura
id: 9b92970e-32f3-52ad-8234-2649fd2a6d8b
status: experimental
description: |
    Complemento de la deteccion por linea de comandos. Sysmon registra en el evento 10
    todo acceso a un proceso; un GrantedAccess de 0x1010, 0x1410 o 0x1438 sobre lsass.exe
    corresponde a los permisos que necesita un volcado de memoria. Detecta tambien las
    implementaciones propias que no usan herramientas conocidas.
references:
    - https://attack.mitre.org/techniques/T1003/001/
author: SOC Detection Pack
date: 2026/08/27
tags:
    - attack.credential-access
    - attack.t1003.001
    - iso27001-2022.a-5-17
    - iso27001-2022.a-8-5
    - nist.ac-6
    - nist.ia-5
logsource:
    category: process_access
    product: windows
detection:
    selection:
        TargetImage|endswith: '\lsass.exe'
        GrantedAccess:
            - '0x1010'
            - '0x1410'
            - '0x1438'
            - '0x143a'
            - '0x1fffff'
    # Se excluyen binarios concretos, no carpetas: con todo System32 fuera,
    # "rundll32.exe comsvcs.dll, MiniDump" (el volcado de LSASS mas comun)
    # pasaba sin alerta, porque rundll32 vive en System32.
    filter_sistema:
        SourceImage:
            - 'C:\Windows\System32\wininit.exe'
            - 'C:\Windows\System32\csrss.exe'
            - 'C:\Windows\System32\services.exe'
            - 'C:\Windows\System32\lsm.exe'
            - 'C:\Windows\System32\svchost.exe'
            - 'C:\Windows\System32\wbem\WmiPrvSE.exe'
            - 'C:\Windows\System32\MRT.exe'
    filter_defender:
        SourceImage|startswith:
            - 'C:\Program Files\Windows Defender\'
            - 'C:\ProgramData\Microsoft\Windows Defender\Platform\'
    condition: selection and not 1 of filter_*
falsepositives:
    - Agentes de EDR y de inventario que inspeccionan procesos, que deben ir a la lista de excepciones por ruta firmada
level: high
